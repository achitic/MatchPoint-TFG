name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Run backend tests
        run: python -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run browser smoke tests
        working-directory: frontend
        run: npm run test:e2e

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build containers
        run: docker compose build
      - name: Start stack and wait for health checks
        run: docker compose up -d --wait
      - name: Verify public endpoints
        run: |
          curl --fail http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1/
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
